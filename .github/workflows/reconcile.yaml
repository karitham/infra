name: reconcile
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  reconcile:
    name: trigger flux reconcile
    runs-on: ubuntu-latest
    steps:
      - name: Trigger
        env:
          FLUX_RECONCILE_URL: ${{ secrets.FLUX_RECONCILE_URL }}
        run: curl -fsS --retry 3 --retry-delay 2 -X POST "$FLUX_RECONCILE_URL"
