apiVersion: apps/v1
kind: Deployment
metadata:
  name: albedo
spec:
  replicas: 1
  # Albedo stores its database on a ReadWriteOnce PVC. Do not run two servers
  # against it during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: albedo
  template:
    metadata:
      labels:
        app: albedo
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
          restartPolicy: Always
          env:
            - name: TS_HOSTNAME
              value: albedo
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /state/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: albedo-tailscale
                  key: authkey
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          startupProbe:
            exec:
              command:
                - tailscale
                - status
                - --peers=false
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: home
              mountPath: /state
            - name: tailscale-socket
              mountPath: /run/tailscale
      containers:
        - name: albedo
          image: ghcr.io/karitham/albedo:main-ceb0f5a
          imagePullPolicy: IfNotPresent
          args:
            # --foreground: since albedo web backgrounds itself by default,
            # and pid 1 exiting would restart this container forever.
            - web
            - --foreground
            - --no-open
            # --tailnet-https points tailscale serve (the sidecar beside us)
            # at this listener: it fetches a certificate for the pod's
            # MagicDNS name and proxies https to it, so the browser gets a
            # secure origin and the page's Origin header matches.
            - --tailnet-https
            # --tailnet-auth signs a tailnet device in without a launch link.
            # The tailnet is the trust boundary; every device on it controls
            # this daemon.
            - --tailnet-auth
            - --port
            - "4317"
          env:
            - name: HOME
              value: /root
            - name: USER
              value: root
            - name: ALBEDO_NO_BROWSER
              value: "1"
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            # The opencode-go extension reads this key when a profile defines
            # no key.
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: albedo-providers
                  key: OPENCODE_GO_API_KEY
          ports:
            - name: web
              containerPort: 4317
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/4317
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/4317
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/4317
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 4Gi
              cpu: "2"
          volumeMounts:
            - name: home
              mountPath: /root
            - name: workspace
              mountPath: /workspace
            - name: tailscale-socket
              mountPath: /run/tailscale
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: albedo-home
        - name: workspace
          persistentVolumeClaim:
            claimName: albedo-workspace
        - name: tailscale-socket
          emptyDir: {}
