apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: mc-survivor
  name: mc-survivor
spec:
  replicas: 1
  serviceName: mc-survivor
  selector:
    matchLabels:
      app: mc-survivor
  template:
    metadata:
      labels:
        app: mc-survivor
    spec:
      containers:
        - name: mc-survivor
          # 2026.8.0+ bundles a CurseForge API key; java21 required
          # (NeoForge/Forge installers here cannot parse newer class files).
          image: itzg/minecraft-server:2026.8.0-java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: CF_PAGE_URL
              value: https://www.curseforge.com/minecraft/modpacks/lucky-world-invasion-reloaded
            - name: CF_FILE_ID
              value: "8581079"
            # Lucky World Invasion Reloaded, MC 1.20.1 / Forge 47.4.20.
            # Boot-verified without extra excludes; if a future pack version
            # adds mis-tagged client mods, add their project IDs to
            # CF_EXCLUDE_MODS and delete the stale jars from /data/mods.
            - name: MC_PORT
              value: "25565"
            - name: INIT_MEMORY
              value: 2G
            - name: MAX_MEMORY
              value: 6G
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
