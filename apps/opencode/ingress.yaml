apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - oc.${TSNET}
      secretName: oc-tls-secret
  rules:
    - host: oc.${TSNET}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4096
