apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: waifubot-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: waifubot
      owner: waifubot
      secret:
        name: pg-credentials
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: waifubot-pg
      serverName: waifubot-pg18
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: waifubot-pg-daily-backup
spec:
  backupOwnerReference: self
  cluster:
    name: waifubot-pg
  immediate: true
  schedule: 0 0 2 * * *
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
