apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waifubot
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: waifubot
  # The ObjectStore (barmancloud.cnpg.io) needs the Barman Cloud plugin's CRD,
  # which the barman-plugin Kustomization installs and waits for first.
  dependsOn:
    - name: barman-plugin
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/waifubot
  prune: true
